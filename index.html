<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>N-Body Simulation</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; }
    canvas { width: 100%; height: 100%; display: block; }
    #error { position: fixed; top: 0; padding: 2rem; color: #fff; font: 18px sans-serif; pointer-events: none; }
    #fps { position: fixed; top: 1rem; right: 1rem; color: #ddd; font: 14px monospace; pointer-events: none; }
    #controls {
      position: fixed; bottom: 1rem; left: 1rem; padding: 0.75rem 1rem;
      background: rgba(0, 0, 0, 0.6); border-radius: 6px; color: #ddd; font: 14px sans-serif;
    }
    #controls[hidden] { display: none; }
    #sliders { display: grid; grid-template-columns: auto 4.5rem; gap: 0.4rem 0.75rem; align-items: center; margin-bottom: 0.75rem; }
    #sliders label { display: flex; justify-content: space-between; gap: 0.75rem; }
    #sliders input[type=number] { width: 4.5rem; box-sizing: border-box; }
    #sliders div { grid-column: 1 / -1; }
    #controls button { font: 14px sans-serif; padding: 0.4rem 1rem; min-width: 6rem; }
  </style>
</head>
<body>
  <canvas id="gpuCanvas"></canvas>
  <div id="error"></div>
  <div id="fps"></div>
  <div id="controls" hidden>
    <div id="sliders"></div>
    <button id="startPause">Start</button>
    <button id="reset">Reset</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
